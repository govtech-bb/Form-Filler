allowBuilds:
  esbuild: true

# Security overrides for transitive dev dependencies flagged by Dependabot (issue #5).
# All dev-scoped — none ship in the extension.
overrides:
  # vitest 3's @vitest/mocker pulls vite 5.4.21 transitively, which is still in the
  # vulnerable range (<= 6.4.2). Force vite 6.4.3 everywhere so the transitive copy —
  # and the old esbuild 0.21.5 it carries — are gone. vitest 3 supports vite 6.
  vite: ^6.4.3
  # @crxjs/vite-plugin pins rollup 2.79.2 in its own deps (arbitrary file write,
  # fixed in 2.80.0). Scoped so vite's rollup 4.x is untouched.
  '@crxjs/vite-plugin>rollup': 2.80.0
  # jsdom pulls form-data 4.0.5 (CRLF injection, fixed in 4.0.6).
  form-data: ^4.0.6
